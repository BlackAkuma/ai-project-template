id: secret_scan
version: 1
description: ไม่มี hardcoded secret ใน staged diff (C-11, security baseline)
trigger:
  action: commit
risk_level: 3                 # security = hard stop เสมอ (ADR-008 hard-stop condition)
requires:
  - check: secret_absent
    class: machine
    patterns:
      - "(?i)api[_-]?key\\s*[:=]\\s*['\"][A-Za-z0-9_\\-]{16,}"
      - "(?i)(secret|password|passwd|token)\\s*[:=]\\s*['\"][^'\"]{8,}"
      - "AKIA[0-9A-Z]{16}"          # AWS access key
      - "-----BEGIN (RSA |EC )?PRIVATE KEY-----"
on_fail:
  effect: hard-stop
  message: "พบ hardcoded secret ใน staged diff — ย้ายไป env/secret store ก่อน commit (C-11)"

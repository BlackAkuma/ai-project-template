name: engine-check (governance linter)

# P2-5 — รัน engine governance linter + resolver tests ทุก push/PR (MVW dogfood)
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # ต้องมี history สำหรับ git diff
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Resolver smoke tests (P1-5)
        run: python engine/test_resolvers.py
      - name: Governance gates (advisory on CI; blocking gates exit 1)
        run: |
          set +e
          for g in secret-scan placeholder-scan prototype-scan; do
            echo "::group::engine check $g"
            python engine/check.py "$g"
            rc=$?
            echo "::endgroup::"
            # hard-stop gates (exit 1) fail the build; advisory (exit 0) pass
            if [ $rc -eq 1 ]; then echo "::error::gate $g failed (blocking)"; FAILED=1; fi
          done
          exit ${FAILED:-0}

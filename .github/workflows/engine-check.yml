name: engine-check (governance linter)

# P2-5 — รัน engine governance linter + resolver tests ทุก push/PR (MVW dogfood)
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # ต้องมี history สำหรับ git diff
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Engine tests (resolvers, events, govern, store)
        run: |
          for t in resolvers events govern store inbox adversarial llm agent repo memory cockpit migrate entities evidence check cli api hook_govern digest writeback testrun init latency agent_run secretscan_scope govern_docs inbox_lock inbox_reopen inbox_scope gitguard; do
            echo "::group::test_$t"; python engine/test_$t.py; echo "::endgroup::"
          done
      - name: Governance gates (advisory on CI; blocking gates exit 1)
        run: |
          set +e
          for g in secret-scan placeholder-scan prototype-scan; do
            echo "::group::engine check $g"
            python engine/check.py "$g"
            rc=$?
            echo "::endgroup::"
            # hard-stop gates (exit 1) fail the build; advisory (exit 0) pass
            if [ $rc -eq 1 ]; then echo "::error::gate $g failed (blocking)"; FAILED=1; fi
          done
          exit ${FAILED:-0}
